name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (defaults to v<version> from tauri.conf.json)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_or_get.outputs.release_id }}
      tag_name: ${{ steps.create_or_get.outputs.tag_name }}
      version: ${{ steps.create_or_get.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or get GitHub Release
        id: create_or_get
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const inputTag = "${{ github.event.inputs.tag || '' }}".trim();
            const refTag = context.ref.startsWith("refs/tags/")
              ? context.ref.replace("refs/tags/", "")
              : "";
            const tag = inputTag || refTag || `v${conf.version}`;
            const version = tag.replace(/^v/, "") || conf.version;
            const releaseName = `FVM Orbit v${version}`;
            const body = [
              `## FVM Orbit v${version}`,
              "",
              "Native desktop spatial cockpit & menu bar / system tray switcher for **[btwld/fvm](https://github.com/btwld/fvm)** (built with Tauri v2 + Rust + React 19).",
              "",
              "### Downloads / 安装包下载",
              "",
              `- **macOS (Apple Silicon / M1–M4)**: \`FVM.Orbit_${version}_aarch64.dmg\` / \`FVM.Orbit_aarch64.app.tar.gz\``,
              `- **macOS (Intel x86_64)**: \`FVM.Orbit_${version}_x64.dmg\` / \`FVM.Orbit_x64.app.tar.gz\``,
              `- **Windows (x64)**: \`FVM.Orbit_${version}_x64-setup.exe\` / \`FVM.Orbit_${version}_x64_en-US.msi\``,
              `- **Windows (ARM64)**: \`FVM.Orbit_${version}_arm64-setup.exe\``,
            ].join("\n");

            const { owner, repo } = context.repo;
            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = existing.data;
              console.log(`Found existing release for ${tag}: id=${release.id}`);
            } catch (err) {
              if (err.status === 404) {
                const created = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  target_commitish: context.sha,
                  name: releaseName,
                  body,
                  draft: false,
                  prerelease: false,
                });
                release = created.data;
                console.log(`Created release for ${tag}: id=${release.id}`);
              } else {
                throw err;
              }
            }

            core.setOutput("release_id", String(release.id));
            core.setOutput("tag_name", tag);
            core.setOutput("version", version);

  build-tauri:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - name: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            args: "--target aarch64-pc-windows-msvc --bundles nsis"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload Tauri bundles to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: ${{ matrix.args }}
