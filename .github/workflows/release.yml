name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - name: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            args: "--target aarch64-pc-windows-msvc --bundles nsis"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish Tauri release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "FVM Orbit v__VERSION__"
          releaseBody: |
            ## FVM Orbit v__VERSION__

            Native desktop spatial cockpit & menu bar / system tray switcher for **[btwld/fvm](https://github.com/btwld/fvm)** (built with Tauri v2 + Rust + React 19).

            ### Downloads / 安装包下载

            - **macOS (Apple Silicon / M1–M4)**: `FVM.Orbit___VERSION___aarch64.dmg` / `FVM.Orbit_aarch64.app.tar.gz`
            - **macOS (Intel x86_64)**: `FVM.Orbit___VERSION___x64.dmg` / `FVM.Orbit_x64.app.tar.gz`
            - **Windows (x64)**: `FVM.Orbit___VERSION___x64-setup.exe` / `FVM.Orbit___VERSION___x64_en-US.msi`
            - **Windows (ARM64)**: `FVM.Orbit___VERSION___arm64-setup.exe`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
