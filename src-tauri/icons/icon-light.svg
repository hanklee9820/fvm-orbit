    <clipPath id="chevronClip">
      <path d="M8.5,13L2.47,7H6.71L11.67,11.95C12.25,12.54 12.25,13.5 11.67,14.07L6.74,19H2.5L8.5,13Z"/>
    </clipPath>

    <!-- Crisp Apple porcelain-white glass plate (bright & pure, never muddy gray) -->
    <linearGradient id="bgWhite" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="56%" stop-color="#FAFBFD"/>
      <stop offset="100%" stop-color="#EFF2F9"/>
    </linearGradient>

    <!-- Delicate violet micro-aura behind > chevron on white -->
    <radialGradient id="auraVioletLight" cx="37%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#6D48C7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#6D48C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Delicate sky-cyan micro-aura under _ cursor on white -->
    <radialGradient id="auraCyanLight" cx="68%" cy="68%" r="36%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#0EA5E9" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle machined edge border for light macOS squircle -->
    <linearGradient id="rimStrokeLight" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#CBD5E1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.52"/>
    </linearGradient>

    <!-- FVM Folded Chevron (Light Edition) — rich royal violet upper wing -->
    <linearGradient id="chevUpperLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#936BFF"/>
      <stop offset="48%" stop-color="#7348DC"/>
      <stop offset="100%" stop-color="#5D37B8"/>
    </linearGradient>

    <!-- FVM Folded Chevron (Light Edition) — authentic deep FVM #553B90 lower wing -->
    <linearGradient id="chevLowerLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5E3FA8"/>
      <stop offset="46%" stop-color="#4D338A"/>
      <stop offset="100%" stop-color="#372268"/>
    </linearGradient>

    <!-- Clean 45-deg crease shadow right under the fold -->
    <linearGradient id="creaseGradLight" x1="8.5" y1="13.0" x2="6.3" y2="15.2" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E0F45" stop-opacity="0.58"/>
      <stop offset="55%" stop-color="#271454" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#271454" stop-opacity="0"/>
    </linearGradient>

    <!-- Vivid Flutter Sky-Cyan underscore cursor calibrated for crisp contrast on white -->
    <linearGradient id="cyanBarLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="48%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Orbit ring gradients tuned for white background -->
    <linearGradient id="orbitBackLight" x1="20%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#6D48C7" stop-opacity="0.18"/>
      <stop offset="44%" stop-color="#553B90" stop-opacity="0.08"/>
      <stop offset="78%" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.26"/>
    </linearGradient>

    <linearGradient id="orbitLeadLight" x1="233.5" y1="419.1" x2="779.9" y2="412.3" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C52E3" stop-opacity="0"/>
      <stop offset="38%" stop-color="#6D48C7" stop-opacity="0.38"/>
      <stop offset="80%" stop-color="#0EA5E9" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.96"/>
    </linearGradient>

    <radialGradient id="nodeFillLight" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="40%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>

    <radialGradient id="nodeGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.52"/>
      <stop offset="38%" stop-color="#0EA5E9" stop-opacity="0.20"/>
      <stop offset="72%" stop-color="#0EA5E9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
  </defs>

