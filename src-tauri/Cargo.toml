[package]
name = "fvm-orbit"
version = "0.1.3"
description = "FVM Orbit — Flutter SDK Spatial Cockpit & Menu Bar Switcher"
authors = ["FVM Orbit"]
edition = "2021"

[lib]
name = "fvm_orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
dirs = "6"
notify = "8"
parking_lot = "0.12"
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSLocale", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "debuginfo"
